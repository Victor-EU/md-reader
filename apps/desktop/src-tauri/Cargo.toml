[package]
name = "mdreader-desktop"
description = "Markdown viewer and editor for the AI round trip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mdreader-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mdreader-app = { workspace = true }
# `generate_context!` emits the plugin configuration through serde_json
# once any plugin is configured in tauri.conf.json (the updater is).
serde_json = { workspace = true }
tauri = { workspace = true }
# Plugins must be direct dependencies of the crate that runs tauri-build,
# otherwise their permissions are unknown to the capability check.
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }

[lints]
workspace = true
