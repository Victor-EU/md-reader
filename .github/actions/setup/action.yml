name: Setup toolchain
description: pnpm, Node, the pinned Rust toolchain, caches, and Linux webkit dependencies.
runs:
  using: composite
  steps:
    - name: Linux system dependencies for Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    # `dtolnay/rust-toolchain` requires the toolchain as an input — it does
    # not read `rust-toolchain.toml`, whatever the file's presence suggests.
    # So the file is read here instead, and stays the one place the version
    # and the components are written down (ADR 0001 pins both).
    - name: The pinned toolchain, out of rust-toolchain.toml
      id: rust
      shell: bash
      run: |
        channel=$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        components=$(sed -n 's/^ *components *= *\[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')
        test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ${{ steps.rust.outputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: '. -> target'
    - name: Install workspace
      shell: bash
      run: pnpm install --frozen-lockfile
