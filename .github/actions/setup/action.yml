name: Setup toolchain
description: pnpm, Node, the pinned Rust toolchain, caches, and Linux webkit dependencies.
runs:
  using: composite
  steps:
    - name: Linux system dependencies for Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    # Pinned to commits rather than to moving tags. This action is used
    # by the release workflow, whose job holds the updater private key and
    # the Developer ID certificate, so everything that runs beside them is
    # chosen on purpose. The trailing comment says which version each SHA
    # is; `gh api repos/<owner>/<action>/git/ref/tags/<tag>` is how to move
    # one forward deliberately.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm
    # `dtolnay/rust-toolchain` requires the toolchain as an input — it does
    # not read `rust-toolchain.toml`, whatever the file's presence suggests.
    # So the file is read here instead, and stays the one place the version
    # and the components are written down (ADR 0001 pins both).
    - name: The pinned toolchain, out of rust-toolchain.toml
      id: rust
      shell: bash
      run: |
        channel=$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        components=$(sed -n 's/^ *components *= *\[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')
        test -n "$channel" || { echo "no channel in rust-toolchain.toml"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
    # `@master` was the worst of these: not a tag anybody had to move but
    # a branch, so every run took whatever had been pushed to it. The
    # action has no release tags at all -- its refs are toolchain names --
    # so a commit is the only thing there is to pin to.
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-03
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        components: ${{ steps.rust.outputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: '. -> target'
    - name: Install workspace
      shell: bash
      run: pnpm install --frozen-lockfile
