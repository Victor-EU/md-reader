name: CI
#
# Actions are pinned to commits, not to `v4`: a major-version tag is a
# branch by another name. The same pins as the release workflow and the
# setup action beside it, so there is one answer in the repository to
# what version of an action runs here. The trailing comment says which
# version each SHA is.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Nightly build of the three bundles.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - run: cargo test --workspace --locked

  bench:
    name: bench (macos-14)
    # One platform. These are measurements, and a number is only worth
    # comparing with itself: the same harness on three different runners
    # would be three sets of numbers with one set of thresholds over
    # them. macOS is the platform the app is developed and released on
    # first, so it is the one whose numbers mean something here.
    #
    # The thresholds in `tools/bench/src` are set from what the harness
    # measures with room over the top, which is what plan 7.4 asks of a
    # shared runner: catch a disaster, do not flake on a busy machine.
    # The results are kept as an artifact because the numbers are worth
    # more over time than any one run of them.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm bench
      # The Rust budget tests carry two numbers each: a loose one for the
      # unoptimized build `cargo test` makes over in the test job, and the
      # real one out of the design — 200 ms to merge a megabyte, 150 ms to
      # align one — which only means anything in an optimized build. Until
      # this line nothing ever built them that way, so the numbers that
      # were actually being checked were the ten-times-looser ones, and
      # the real budgets were prose. They belong here rather than in the
      # test job: it is a measurement, it wants one runner, and this is
      # where the measurements are.
      - run: cargo test -p markdown-core --locked --release --test merge_budget --test block_budget
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results
          path: tools/bench/results/*.json
          if-no-files-found: warn

  build:
    name: build (${{ matrix.os }})
    # A cold Rust build on three runners is too slow for the pull-request
    # loop: bundles are produced on main, on release tags, nightly, and on demand.
    if: github.event_name != 'pull_request'
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # No updater artifacts here: signing them needs the release key,
      # which this workflow has no business holding. Releases are cut by
      # release.yml on a tag.
      - name: Build unsigned bundle
        run: pnpm tauri build --ci --config src-tauri/unsigned.conf.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
