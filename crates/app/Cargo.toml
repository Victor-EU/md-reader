[package]
name = "markdown-app"
description = "Tauri command handlers and event plumbing. Thin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
markdown-core = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-service = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-specta = { workspace = true }

# macOS keeps one instance of a bundled app itself and sends the files as
# an Apple event, so the plugin is only wanted on the platforms that do not.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }

[dev-dependencies]
# The other half of the protocol, for the in-process client that
# exercises every tool (plan WP 3.1).
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[lints]
workspace = true
