[package]
name = "mdreader-app"
description = "Tauri command handlers and event plumbing. Thin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
mdreader-core = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-specta = { workspace = true }

# macOS keeps one instance of a bundled app itself and sends the files as
# an Apple event, so the plugin is only wanted on the platforms that do not.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[lints]
workspace = true
