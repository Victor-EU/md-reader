[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
mdreader-core = { path = "crates/core" }
mdreader-app = { path = "crates/app" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = { version = "2.6" }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
base64 = "0.22"
blake3 = { version = "1.8", features = ["pure"] }
chardetng = "1.0"
encoding_rs = "0.8"
similar = "2.7"
notify = "8.2"
notify-debouncer-full = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
zstd = "0.13"
tempfile = "3.27"
proptest = "1.11"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
