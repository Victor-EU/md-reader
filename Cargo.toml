[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
markdown-core = { path = "crates/core" }
markdown-app = { path = "crates/app" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = { version = "2.6" }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.11"
base64 = "0.22"
blake3 = { version = "1.8", features = ["pure"] }
chardetng = "1.0"
encoding_rs = "0.8"
similar = "2.7"
ignore = "0.4"
nucleo-matcher = "0.3"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
notify = "8.2"
notify-debouncer-full = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
zstd = "0.13"
tempfile = "3.27"
getrandom = "0.3"
# The MCP server of design 9. `default-features = false` drops the base64
# and client halves; what is left is the server, the tool macros, and the
# streamable HTTP transport the plan asks for.
rmcp = { version = "3.2", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
schemars = "1.0"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros"] }
proptest = "1.11"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
